[package]
name = "kalien_score"
description = "Kalien score contract: on-chain Asteroids tape replay and KALIEN rewards"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]
doctest = false
test = false

# RV32 ELF bin wrapper. The name must stay the snake-case package name:
# `thruput build` looks for the ELF at `release/<snake_name>`.
[[bin]]
name = "kalien_score"
path = "src/main.rs"
required-features = ["entrypoints"]
test = false
bench = false

# Feature names are contracts with the toolchain; do not rename them.
[features]
entrypoints = []
dev = ["thruput-sdk/dev", "thruput-erc20-if/dev", "kalien_token/dev"]
thruput-integration-test = []

# `alloc` (thruput-sdk): without it the guest reads calldata into a fixed 4,096-byte
# buffer, and a 36,000-frame tape is 18,024 bytes. With it the calldata goes
# into one exact-size heap buffer (the replay itself does not allocate).
[target.'cfg(target_arch = "riscv32")'.dependencies]
thruput-sdk = { version = "=0.57.0", registry = "thruput", features = ["alloc"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
thruput-sdk = { version = "=0.57.0", registry = "thruput", features = ["std"] }

[dependencies]
thruput-erc20-if = { version = "=0.1.68", registry = "thruput" }
# For the `KalienTokenAdmin` client (`handover_token`); no token entrypoints are linked.
kalien_token = { path = "../kalien_token" }
asteroids-verifier-core = { path = "../../../asteroids-core", default-features = false }

[dev-dependencies]
kalien_score = { path = ".", features = ["dev"] }
kalien_token = { path = "../kalien_token", features = ["dev"] }
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
thruput-trace = { version = "=0.61.0", registry = "thruput" }
asteroids-verifier-core = { path = "../../../asteroids-core" }
